[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esg-commitment-audit"
version = "0.5.0.dev1"
description = "Local-first commitment and AI-revisability audit workbench"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Xue Zhi Xin (ICS-TEC)" }
]
keywords = [
  "ESG",
  "climate",
  "commitment",
  "CRV",
  "assurance",
  "audit",
  "AI governance",
  "revisability",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "fastapi>=0.110,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.6,<3",
  "pdfplumber>=0.11,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "PyYAML>=6,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]

[project.scripts]
esg-commitment-audit-workbench = "esg_commitment_audit.cli:main"
esg-commitment-audit-admin = "esg_commitment_audit.admin:main"
esg-commitment-audit-mcp = "esg_commitment_audit.mcp_server:main"
ai-revisability-audit = "esg_commitment_audit.revisability_cli:main"
esg-commitment-audit = "esg_commitment_audit.esg_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
esg_commitment_audit = [
  "resources/**/*",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
