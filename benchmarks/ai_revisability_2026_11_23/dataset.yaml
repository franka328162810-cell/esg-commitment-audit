benchmark_id: ai-revisability-policy-baseline-2026-11-23
benchmark_version: "1.0.0"
frozen_at: 2026-11-23
methodology_version: RFP-AI-revisability-document-v0.2
title: AI Revisability Policy Baseline 2026-11-23
description: >-
  A multilingual baseline covering company AI policies, Chinese public
  governance instruments, the EU AI Act, current UK statutory instruments, US
  federal actions, and enacted US state AI laws. Every document is tied to an
  official source URL and a frozen SHA-256 snapshot. Unspecified control grades
  are absent.
claim_boundary: >-
  This benchmark evaluates written governance controls and declared
  revisability architecture. It does not test model behaviour, legal
  compliance, safety, institutional independence, or the truth of an
  organisation's claims. All documents were examined during rule development;
  the evaluation split is frozen for reporting but is not an independent
  third-party holdout. Official enactment summaries are marked as summaries,
  not full statutory text.
thresholds:
  minimum_exact_grade_accuracy: 0.80
  minimum_positive_precision: 0.85
  minimum_positive_recall: 0.85
  minimum_evidence_coverage: 1.0

