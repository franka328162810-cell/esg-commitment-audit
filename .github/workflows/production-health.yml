name: Production health

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe health and customer endpoints
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://ics-commitment-audit-api.franka328162810.workers.dev"
          user_agent="ics-commitment-audit-monitor/0.3.0"
          health_file="$RUNNER_TEMP/health.json"
          workspace_file="$RUNNER_TEMP/workspace.html"
          recursive_file="$RUNNER_TEMP/recursive-freedom.html"
          recursive_sample_file="$RUNNER_TEMP/recursive-freedom-sample.html"
          landing_file="$RUNNER_TEMP/landing.html"

          health_status="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --max-time 20 --user-agent "$user_agent" \
            --output "$health_file" --write-out '%{http_code}' \
            "$base_url/v1/health")"
          printf 'Health HTTP %s\n' "$health_status"
          cat "$health_file"

          test "$health_status" = "200"
          jq --exit-status \
            '.status == "ok" and .service == "ics-commitment-audit"' \
            "$health_file"

          activation_status="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --max-time 20 --user-agent "$user_agent" \
            --output /dev/null --write-out '%{http_code}' \
            "$base_url/activate")"
          printf 'Activation HTTP %s\n' "$activation_status"
          test "$activation_status" = "200"

          workspace_status="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --max-time 20 --user-agent "$user_agent" \
            --output "$workspace_file" --write-out '%{http_code}' \
            "$base_url/workspace")"
          printf 'Workspace HTTP %s\n' "$workspace_status"
          test "$workspace_status" = "200"
          grep --quiet 'Run and review an audit' "$workspace_file"
          grep --quiet 'recursive-freedom' "$workspace_file"

          recursive_status="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --max-time 20 --user-agent "$user_agent" \
            --output "$recursive_file" --write-out '%{http_code}' \
            "$base_url/recursive-freedom")"
          printf 'Recursive Freedom HTTP %s\n' "$recursive_status"
          test "$recursive_status" = "200"
          grep --quiet 'Recursive Freedom Audit for AI' "$recursive_file"
          grep --quiet '50 check-level decisions' "$recursive_file"

          recursive_sample_status="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --max-time 20 --user-agent "$user_agent" \
            --output "$recursive_sample_file" --write-out '%{http_code}' \
            "$base_url/recursive-freedom/sample")"
          printf 'Recursive Freedom sample HTTP %s\n' "$recursive_sample_status"
          test "$recursive_sample_status" = "200"
          grep --quiet 'Recursive Freedom Audit sample' "$recursive_sample_file"
          grep --quiet 'Anthropic' "$recursive_sample_file"

          landing_status="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --max-time 20 --user-agent "$user_agent" \
            --output "$landing_file" --write-out '%{http_code}' \
            "$base_url/")"
          printf 'Landing HTTP %s\n' "$landing_status"
          test "$landing_status" = "200"
          grep --quiet 'icsstudies.gumroad.com/l/ics-commitment-audit' "$landing_file"
          grep --quiet '30-day no-questions-asked full refund' "$landing_file"
