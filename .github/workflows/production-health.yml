name: Production health

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe health and customer endpoints
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://esg-commitment-audit-api.franka328162810.workers.dev"
          user_agent="esg-commitment-audit-monitor/0.3.0"
          health_file="$RUNNER_TEMP/health.json"
          workspace_file="$RUNNER_TEMP/workspace.html"
          ai_revisability_file="$RUNNER_TEMP/ai-revisability.html"
          ai_revisability_sample_file="$RUNNER_TEMP/ai-revisability-sample.html"
          landing_file="$RUNNER_TEMP/landing.html"

          health_status="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --max-time 20 --user-agent "$user_agent" \
            --output "$health_file" --write-out '%{http_code}' \
            "$base_url/v1/health")"
          printf 'Health HTTP %s\n' "$health_status"
          cat "$health_file"

          test "$health_status" = "200"
          jq --exit-status \
            '.status == "ok" and .service == "esg-commitment-audit"' \
            "$health_file"

          activation_status="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --max-time 20 --user-agent "$user_agent" \
            --output /dev/null --write-out '%{http_code}' \
            "$base_url/activate")"
          printf 'Activation HTTP %s\n' "$activation_status"
          test "$activation_status" = "200"

          workspace_status="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --max-time 20 --user-agent "$user_agent" \
            --output "$workspace_file" --write-out '%{http_code}' \
            "$base_url/workspace")"
          printf 'Workspace HTTP %s\n' "$workspace_status"
          test "$workspace_status" = "200"
          grep --quiet 'Run and review an audit' "$workspace_file"
          grep --quiet 'AI Alignment Revisability Audit' "$workspace_file"

          ai_revisability_status="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --max-time 20 --user-agent "$user_agent" \
            --output "$ai_revisability_file" --write-out '%{http_code}' \
            "$base_url/ai-revisability-audit")"
          printf 'AI Revisability HTTP %s\n' "$ai_revisability_status"
          test "$ai_revisability_status" = "200"
          grep --quiet 'AI Alignment Revisability Audit' "$ai_revisability_file"
          grep --quiet '28 written controls' "$ai_revisability_file"

          ai_revisability_sample_status="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --max-time 20 --user-agent "$user_agent" \
            --output "$ai_revisability_sample_file" --write-out '%{http_code}' \
            "$base_url/ai-revisability-audit/sample")"
          printf 'AI Revisability sample HTTP %s\n' "$ai_revisability_sample_status"
          test "$ai_revisability_sample_status" = "200"
          grep --quiet 'AI Alignment Revisability Audit sample' "$ai_revisability_sample_file"
          grep --quiet 'synthetic AI governance policy' "$ai_revisability_sample_file"

          landing_status="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --max-time 20 --user-agent "$user_agent" \
            --output "$landing_file" --write-out '%{http_code}' \
            "$base_url/")"
          printf 'Landing HTTP %s\n' "$landing_status"
          test "$landing_status" = "200"
          grep --quiet 'icsstudies.gumroad.com/l/esg-commitment-audit' "$landing_file"
          grep --quiet '30-day no-questions-asked full refund' "$landing_file"
