name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests validation scripts
      - name: Format check
        run: ruff format --check src tests validation scripts
      - name: Test
        run: python -m pytest
      - name: CLI smoke test
        run: esg-commitment-audit audit examples/strong_commitment.txt --format json --output build/report.json

  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install Cloudflare dependencies
        run: npm ci
        working-directory: cloudflare
      - name: Validate plugin core and bundles
        run: node --test plugins/core/server.test.mjs plugins/core/bundles.test.mjs
      - name: Validate Worker types
        run: npm run check
        working-directory: cloudflare
