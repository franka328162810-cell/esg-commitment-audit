<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESG Commitment Audit Workbench</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="masthead">
    <div>
      <p class="eyebrow">ICS-TEC · LOCAL WORKBENCH</p>
      <h1>ESG / 气候承诺结构审计</h1>
      <p class="subtitle">检查承诺是否可观测、可执行、可逆；结果不是合规认证，也不是漂绿判定。</p>
      <p class="subtitle"><a href="/revisability">Open AI Alignment Revisability Audit →</a></p>
    </div>
    <span class="local-badge">本机运行 · 不上传云端</span>
  </header>

  <main>
    <section class="panel input-panel">
      <div class="panel-heading">
        <div>
          <p class="step-label">01 · INPUT</p>
          <h2>读取披露文件</h2>
        </div>
        <label class="weights-label">
          权重方案
          <select id="weights">
            <option value="default">default · 0.35 / 0.35 / 0.30</option>
            <option value="obs-priority">obs-priority</option>
            <option value="enf-priority">enf-priority</option>
            <option value="rev-priority">rev-priority</option>
            <option value="esg-balanced">esg-balanced</option>
          </select>
        </label>
      </div>

      <div class="input-grid">
        <form id="upload-form" class="drop-zone">
          <input id="file-input" type="file" name="file" accept=".pdf,.docx,.txt,.md,.markdown" required>
          <label for="file-input">
            <strong>选择或拖入文件</strong>
            <span>PDF（需文本层）、DOCX、TXT、Markdown；本机上限 20 MB</span>
          </label>
          <p id="selected-file" class="selected-file">尚未选择文件</p>
          <button type="submit" class="primary-button">审计文件</button>
        </form>

        <form id="text-form" class="text-zone">
          <label for="text-input"><strong>或者直接粘贴承诺文本</strong></label>
          <textarea id="text-input" placeholder="例如：公司承诺以2020年为基准年，到2030年将范围1和范围2排放减少50%……"></textarea>
          <button type="submit" class="secondary-button">审计粘贴文本</button>
        </form>
      </div>

      <p id="status-line" class="status-line" role="status"></p>
    </section>

    <section id="error-panel" class="error-panel" hidden></section>

    <section id="results" class="results" hidden>
      <div class="results-bar">
        <div>
          <p class="step-label">02 · REPORT</p>
          <h2>审计结果</h2>
        </div>
        <div class="download-group" aria-label="下载报告">
          <button id="download-html" type="button">HTML</button>
          <button id="download-markdown" type="button">Markdown</button>
          <button id="download-json" type="button">JSON</button>
        </div>
      </div>

      <section id="summary" class="summary-grid"></section>
      <section id="document-warnings" class="notice-list"></section>
      <section id="commitments" class="commitment-list"></section>
      <section class="disclaimer-box">
        <h3>解释边界</h3>
        <p id="disclaimer"></p>
      </section>
    </section>
  </main>

  <footer>
    <p>v0.4.0.dev2 · Apache 2.0 · Copyright 2026 Xue Zhi Xin (ICS-TEC)</p>
    <p>只审计文本结构，不验证外部排放数据，不提供 CSRD、SBTi 或其他认证结论。</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
